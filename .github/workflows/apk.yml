name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install --legacy-peer-deps
      - run: npm i --legacy-peer-deps react-is @capacitor/core @capacitor/android @capacitor/filesystem @capacitor/share
      - run: npm i -D --legacy-peer-deps @capacitor/cli
      - name: Add native file/share support
        run: |
          cat > src/nativeShim.ts <<'EOF'
          import { Capacitor } from '@capacitor/core';
          import { Filesystem, Directory } from '@capacitor/filesystem';
          import { Share } from '@capacitor/share';
          import { jsPDF } from 'jspdf';

          if (Capacitor.isNativePlatform()) {
            const blobMap = new Map<string, Blob>();
            const origCreate = URL.createObjectURL.bind(URL);
            URL.createObjectURL = (obj: Blob | MediaSource) => {
              const url = origCreate(obj);
              if (obj instanceof Blob) blobMap.set(url, obj);
              return url;
            };

            const toBase64 = (blob: Blob) =>
              new Promise<string>((resolve, reject) => {
                const r = new FileReader();
                r.onload = () => resolve(String(r.result).split(',')[1] || '');
                r.onerror = () => reject(r.error);
                r.readAsDataURL(blob);
              });

            const saveAndShare = async (name: string, blob: Blob, title?: string, text?: string) => {
              try {
                const safe = (name || 'file').replace(/[^\w.\- ]+/g, '_');
                const written = await Filesystem.writeFile({
                  path: safe,
                  data: await toBase64(blob),
                  directory: Directory.Cache,
                });
                await Share.share({ title: title || safe, text, url: written.uri, dialogTitle: safe });
              } catch (e) {
                const msg = e instanceof Error ? e.message : String(e);
                if (!/cancel/i.test(msg)) alert('Could not save file: ' + msg);
              }
            };

            (window as any).__saveAndShare = saveAndShare;

            // CSV / JSON backups: anchor clicks with a download attribute
            const origClick = HTMLAnchorElement.prototype.click;
            HTMLAnchorElement.prototype.click = function () {
              const blob = this.hasAttribute('download') ? blobMap.get(this.href) : undefined;
              if (blob) {
                void saveAndShare(this.getAttribute('download') || 'file', blob);
                return;
              }
              origClick.call(this);
            };

            // Invoice share (PDF file + summary text)
            (navigator as any).canShare = () => true;
            (navigator as any).share = async (data: { title?: string; text?: string; files?: File[] }) => {
              if (data.files && data.files.length) {
                await saveAndShare(data.files[0].name, data.files[0], data.title, data.text);
              } else {
                await Share.share({ title: data.title, text: data.text });
              }
            };

            // WebView cannot print directly
            window.print = () => {
              alert('Direct printing is not available in the app yet. Use the PDF button, then print or share the PDF from the share menu.');
            };
          }

          // Every PDF save goes through here (doc.save is replaced at build time)
          (window as any).__savePdf = (doc: jsPDF, filename: string) => {
            if (Capacitor.isNativePlatform()) {
              (window as any).__saveAndShare(filename, doc.output('blob'));
            } else {
              doc.save(filename);
            }
          };
          EOF
          sed -i '1i import "./nativeShim";' src/main.tsx
          sed -i 's/doc\.save(/(window as any).__savePdf(doc, /' src/services/a5PdfGenerator.ts src/components/PartiesWorkspace.tsx
      - run: npx cap init "Clinix POS" com.clinix.pos --web-dir=dist
      - run: npm run build
      - run: npx cap add android
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: clinix-pos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
