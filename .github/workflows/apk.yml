name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npm i @capacitor/core @capacitor/android
      - run: npm i -D @capacitor/cli
      - run: npx cap init "Clinix POS" com.clinix.pos --web-dir=dist
      - run: npm run build
      - run: npx cap add android
      - run: sed -i 's#<application#<uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: clinix-pos-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
